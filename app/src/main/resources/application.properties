# H2
spring.datasource.url=${DB_URL:jdbc:h2:mem:outboxdb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.datasource.hikari.maximum-pool-size=45

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Outbox
outbox.pending-threshold=${OUTBOX_PENDING_THRESHOLD:10}
outbox.max-tentativas=${OUTBOX_MAX_TENTATIVAS:3}

#Reprocessamento
outbox.time.to-reprocessing=15